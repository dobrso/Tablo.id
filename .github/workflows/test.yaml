name: Django CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: tabloid_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Забираем код проекта
        uses: actions/checkout@v4

      - name: Устанавливаем Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Устанавливаем Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Устанавливаем зависимости
        run: |
          poetry install --no-interaction --no-root

      - name: Запускаем тесты
        env:
          DJANGO_SETTING_MODULE: tabloid.settings
          DB_HOST: localhost
          DB_NAME: tabloid_test
          DB_USER: admin
          DB_PASSWORD: admin_password
          REDIS_HOST: localhost
          SECRET_KEY: secret
        run: |
          poetry run pytest