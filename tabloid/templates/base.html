{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tablo.id - Делись постами{% endblock %}</title>
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'posts:post_list' %}">
                <span class="worm-mascot">
                    <img src="{% static 'images/chorvyak.png' %}" alt="чорвяк">
                </span>
                Tablo.id
            </a>

            {% if request.user.is_authenticated %}
                <a href="{% url 'users:profile' %}">Профиль</a>

                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit">
                        Выйти
                    </button>
                </form>
            {% else %}
                <a href="{% url 'users:register' %}">Регистрация</a>
                <a href="{% url 'users:login' %}">Войти</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="toast-body" id="toastBody"></div>

    <script src="{% static 'scripts/notification.js' %}"></script>
</body>
</html>
